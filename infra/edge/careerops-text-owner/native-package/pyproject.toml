[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "careerops-reranker-native"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Only the pinned CareerOps Jina native runtime/handler for isolated owner qualification"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic==2.13.5", "torch==2.14.0", "transformers==4.57.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["careerops_reranker"]
namespaces = false
