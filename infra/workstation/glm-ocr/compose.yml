# GLM-OCR model server on WORKSTATION (Docker Desktop, WSL2 backend, NVIDIA GPU).
# Pinned: vLLM v0.30.0 image by digest (CUDA 13.0.3, torch 2.13.0, sm_120) and zai-org/GLM-OCR by revision.
# Offline at runtime: weights are mounted read-only from ${VKM_MODELS_DIR}; no telemetry; loopback-only port.
# The OCR client (vkm_corpus.ocr) keeps every raw response; this server is a stateless recognizer.
name: vkm-glm-ocr

services:
  glm-ocr:
    image: ${VKM_GLM_OCR_IMAGE:-vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90}
    restart: "no"
    ports:
      - "127.0.0.1:${VKM_GLM_OCR_PORT:-8080}:8000"
    ipc: host
    gpus: all
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${VKM_MODELS_DIR}:/models:ro
    command:
      - /models/zai-org__GLM-OCR/2e85a62840ccac27daa451df36c736c4636b8628
      - --served-model-name=glm-ocr
      - --dtype=bfloat16
      - --max-model-len=16384
      - --max-num-seqs=64
      - --max-num-batched-tokens=32768
      - --gpu-memory-utilization=0.80
      - --limit-mm-per-prompt={"image":1}
      - --speculative-config={"method":"mtp","num_speculative_tokens":3}
      - --enable-prefix-caching
      - --seed=0
      - --host=0.0.0.0
      - --port=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
