# VKM Corpus Platform v0 — persistent projection services on CORE.
# Rebuildable projections of the canonical Parquet layer: nothing here is a source of truth.
# Host paths come only from ${VKM_DATA_ROOT} and ${VKM_SECRETS_DIR} (host-local .env, never committed).
# Ports of the databases are published on loopback only (admins use an SSH tunnel); VKM API/MCP containers reach them
# by service name on the internal network (H-26). Images are pinned by digest (K-24).
name: vkm-core

# Application services (agent G, CP-19): one image built from infra/core/api/Dockerfile. They all run as the owner of
# the canonical root (host .env VKM_DATA_UID/VKM_DATA_GID; the root is 0750 for its owner): api reads it through :ro
# mounts, mcp/mcp-admin only talk to the api, and only the one-shot vkm-job writes it. Compose file-secrets are bind
# mounts that keep the host owner and mode, so each secret file of these services is owned by VKM_DATA_UID with mode
# 0400 (neo4j_auth stays Neo4j's own; the app services read neo4j_password). Features used exist in Compose 2.26.
x-vkm-app: &vkm-app
  image: ${VKM_API_IMAGE:-vkm-corpus-api:0.1.0}
  user: "${VKM_DATA_UID:?}:${VKM_DATA_GID:?}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [vkm_internal]
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "5"}

services:
  neo4j:
    image: ${VKM_NEO4J_IMAGE:-neo4j:5.26.31-community@sha256:5eb12ad77fa46ab73e23df9ea1f43f5c0f2a79523435577648e046be042b9b93}
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # HTTP / Neo4j Browser (SSH tunnel)
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_server_memory_heap_initial__size: 2g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 2g
      NEO4J_db_memory_transaction_total_max: 1g
      NEO4J_db_tx__log_rotation_retention__policy: "1G size"
      NEO4J_server_jvm_additional: "-XX:+ExitOnOutOfMemoryError"
      NEO4J_dbms_usage__report_enabled: "false"
    secrets:
      - neo4j_auth
    volumes:
      - ${VKM_DATA_ROOT}/neo4j/data:/data
      - ${VKM_DATA_ROOT}/neo4j/logs:/logs
      - ${VKM_DATA_ROOT}/neo4j/import:/import
    mem_limit: 6g
    networks: [vkm_internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7687' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  opensearch:
    image: ${VKM_OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.8.0@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"   # REST; 9600 (Performance Analyzer) is not published
    environment:
      cluster.name: vkm-core
      node.name: vkm-os-1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms3g -Xmx3g"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      action.destructive_requires_name: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ${VKM_DATA_ROOT}/opensearch/data:/usr/share/opensearch/data
    mem_limit: 6g
    networks: [vkm_internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  # VKM API (FastAPI /v1): reads only the CANONICAL snapshot (H-07); CORE LAN address only (H-26).
  api:
    <<: *vkm-app
    restart: unless-stopped
    command: ["api", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      VKM_DATA_ROOT: /data
      VKM_DATA_ROLE: canonical
      VKM_NEO4J_URI: bolt://neo4j:7687
      VKM_NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      VKM_OPENSEARCH_URL: http://opensearch:9200
      VKM_RERANK_URL: ${VKM_RERANK_URL:-}
      VKM_RERANK_TOKEN_FILE: /run/secrets/rerank_token
      VKM_PG_DSN_FILE: /run/secrets/pg_dsn
      VKM_API_TOKEN_FILE: /run/secrets/api_read_token
      VKM_API_WRITE_TOKEN_FILE: /run/secrets/api_write_token
      # query embeddings for /v1/search/hybrid (RX580 retrieval service on the internal network)
      VKM_EMBED_URL: http://rx580-retrieval:8790
      VKM_EMBED_TOKEN_FILE: /run/secrets/embed_token
      # late interaction (mLateOn MaxSim over the RRF top-100) on by default: warm p50 148 ms vs 76 ms without (28.09)
      VKM_HYBRID_LATE_DEFAULT: "1"
      # visual route (agent VIS): page-image channel for queries with picture words; RX580 gate 29.09: F16 query
      # tower p50 108 ms / p95 144 ms, device VRAM 3.4 GiB with dense and late; "0" switches it off without a rebuild
      VKM_HYBRID_VISUAL_ROUTE: "${VKM_HYBRID_VISUAL_ROUTE:-1}"
      VKM_LOG_LEVEL: INFO
    secrets: [api_read_token, api_write_token, neo4j_password, rerank_token, pg_dsn, embed_token]
    # Directories (not files), so an atomic replace (CURRENT, the DuckDB file) is seen by the container. Long syntax
    # with create_host_path: false — a missing path (duckdb/ exists only after the first reconcile) fails `up`
    # instead of being created by the daemon as root, which would lock vkm-job out of it.
    volumes:
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}/.vkm_root.json
        target: /data/.vkm_root.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}/canonical
        target: /data/canonical
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}/artifacts
        target: /data/artifacts
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}/duckdb
        target: /data/duckdb
        read_only: true
        bind: {create_host_path: false}
      # navigation layer (NAV): derived/navigation/<snapshot>/nav.duckdb + CURRENT (NAVIGATION_LAYER.md)
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}/derived/navigation
        target: /data/derived/navigation
        read_only: true
        bind: {create_host_path: false}
      # PUBLIC evidence catalogues pack for reconstruct_topic: derived/catalogues/<commit12>/ + CURRENT
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}/derived/catalogues
        target: /data/derived/catalogues
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "${VKM_CORE_LAN_ADDR:?}:${VKM_API_PORT:-8000}:8000"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MCP vkm-corpus (read tools, streamable HTTP, stateless): uses only the API read token.
  mcp:
    <<: *vkm-app
    restart: unless-stopped
    command: ["mcp", "serve", "--kind", "read", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      VKM_API_URL: http://api:8000
      VKM_API_TOKEN_FILE: /run/secrets/api_read_token
      VKM_MCP_TOKEN_FILE: /run/secrets/mcp_token
      VKM_MCP_ALLOWED_HOSTS: ${VKM_MCP_ALLOWED_HOSTS:?}
      VKM_LOG_LEVEL: INFO
    secrets: [api_read_token, mcp_token]
    ports:
      - "${VKM_CORE_LAN_ADDR:?}:${VKM_MCP_PORT:-8765}:8765"
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # MCP vkm-corpus-admin (reprocess plan-first, H-12): started only with --profile admin; uses the API write token.
  mcp-admin:
    <<: *vkm-app
    profiles: ["admin"]
    restart: unless-stopped
    command: ["mcp", "serve", "--kind", "admin", "--host", "0.0.0.0", "--port", "8766"]
    environment:
      VKM_API_URL: http://api:8000
      VKM_API_WRITE_TOKEN_FILE: /run/secrets/api_write_token
      VKM_MCP_ADMIN_TOKEN_FILE: /run/secrets/mcp_admin_token
      VKM_MCP_ALLOWED_HOSTS: ${VKM_MCP_ADMIN_ALLOWED_HOSTS:-}   # empty -> loopback only (fails closed)
      VKM_LOG_LEVEL: INFO
    secrets: [api_write_token, mcp_admin_token]
    ports:
      - "${VKM_CORE_LAN_ADDR:?}:${VKM_MCP_ADMIN_PORT:-8766}:8766"
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # RX580 retrieval service (agent K; постановка лаборатории §56): resident dense + late-interaction encoders on the
  # AMD RX 580 through /dev/dri (Vulkan/RADV), one llama-server child per model, keepalive against runtime-PM suspend.
  # The container user needs the host's render/video groups (numeric GIDs in the host-local .env). Models, tokenizers
  # and the deployment JSON are read-only; the Mesa shader cache and logs live in a writable host directory.
  # derived/embeddings of the canonical root is mounted read-write: bulk document encoding runs inside this container
  # (`docker compose exec rx580-retrieval python -m vkm_corpus.embeddings.cli encode ...`, infra/core/lab_stage2.sh)
  # because the llama-servers listen on the container's loopback; the service itself only reads token vectors there.
  # Published on loopback only (admins, SSH tunnel); the API reaches it by service name.
  rx580-retrieval:
    image: ${VKM_RX580_IMAGE:-vkm-rx580-retrieval:0.1.0}
    restart: unless-stopped
    user: "${VKM_RX580_UID:?}:${VKM_RX580_GID:?}"   # owner of ${VKM_RX580_ROOT}/cache and of derived/embeddings
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VKM_RENDER_GID:?}"
      - "${VKM_VIDEO_GID:?}"
    environment:
      VKM_RX580_CONFIG: /config/rx580.json
      VKM_RX580_KEEPALIVE_S: "${VKM_RX580_KEEPALIVE_S:-2}"
      VKM_OPENSEARCH_URL: http://opensearch:9200
      VKM_RX580_TOKEN_FILE: /run/secrets/rx580_token
      VKM_DATA_ROOT: /data
      VKM_DATA_ROLE: canonical
    secrets: [rx580_token]
    volumes:
      - type: bind
        source: ${VKM_RX580_ROOT:?}/models
        target: /models
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_RX580_ROOT:?}/config
        target: /config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_RX580_ROOT:?}/cache
        target: /cache
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}/derived/embeddings
        target: /data/derived/embeddings
        bind: {create_host_path: false}
    ports:
      - "127.0.0.1:8790:8790"
    mem_limit: 6g            # dense + late + the visual query tower (29.09: 2.4 GiB before the visual slot)
    networks: [vkm_internal]
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  # Queue-driven bulk encoding on the RX580 (claims jobs of the PostgreSQL queue of vkm_corpus.ops once the
  # coordinator provides `embed worker`); on demand only: docker compose --profile jobs run --rm rx580-embed-worker
  rx580-embed-worker:
    image: ${VKM_RX580_IMAGE:-vkm-rx580-retrieval:0.1.0}
    profiles: ["jobs"]
    user: "${VKM_RX580_UID:?}:${VKM_RX580_GID:?}"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VKM_RENDER_GID:?}"
      - "${VKM_VIDEO_GID:?}"
    environment:
      VKM_RX580_CONFIG: /config/rx580-worker.json
      VKM_DATA_ROOT: /data
      VKM_DATA_ROLE: canonical
      VKM_PG_DSN_FILE: /run/secrets/pg_dsn
    secrets: [pg_dsn]
    volumes:
      - type: bind
        source: ${VKM_RX580_ROOT:?}/models
        target: /models
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_RX580_ROOT:?}/config
        target: /config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_RX580_ROOT:?}/cache
        target: /cache
        bind: {create_host_path: false}
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}/derived/embeddings
        target: /data/derived/embeddings
        bind: {create_host_path: false}
    entrypoint: ["python", "-m", "vkm_corpus.embeddings.cli"]
    command: ["specs"]
    mem_limit: 4g
    networks: [vkm_internal]
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  # One-shot jobs on the CANONICAL root (the only writer on CORE), e.g.
  #   docker compose --profile jobs run --rm vkm-job canon init --kind CANONICAL
  #   docker compose --profile jobs run --rm vkm-job core reconcile --run-id <RUN>
  vkm-job:
    <<: *vkm-app
    profiles: ["jobs"]
    restart: "no"
    entrypoint: ["vkm-corpus"]
    command: ["core", "reconcile", "--help"]
    environment:
      VKM_DATA_ROOT: /data
      VKM_DATA_ROLE: canonical
      VKM_NEO4J_URI: bolt://neo4j:7687
      VKM_NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      VKM_OPENSEARCH_URL: http://opensearch:9200
      VKM_LOG_LEVEL: INFO
    secrets: [neo4j_password]
    volumes:   # read-WRITE: only this service
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}
        target: /data
        bind: {create_host_path: false}

  # Nightly checks (agent OPS; OPERATIONS.md «Ночные задания и резервная копия»): the image and settings of vkm-job,
  # but the canonical root is mounted READ-ONLY and the container is capped so that the API and MCP stay responsive
  # (at most 12 CPUs, a quarter of the default CPU weight, bounded memory). Used only by
  # infra/core/nightly/nightly_checks.sh, e.g.  docker compose --profile nightly run --rm -T vkm-nightly canon validate
  vkm-nightly:
    <<: *vkm-app
    profiles: ["nightly"]
    restart: "no"
    entrypoint: ["vkm-corpus"]
    command: ["canon", "status"]
    environment:
      VKM_DATA_ROOT: /data
      VKM_DATA_ROLE: canonical
      VKM_NEO4J_URI: bolt://neo4j:7687
      VKM_NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      VKM_OPENSEARCH_URL: http://opensearch:9200
      VKM_LOG_LEVEL: INFO
    secrets: [neo4j_password]
    cpus: 12
    cpu_shares: 256
    mem_limit: 6g
    volumes:   # read-only: the checks never write the canonical root (their receipts are written by the host script)
      - type: bind
        source: ${VKM_DATA_ROOT_HOST:?}
        target: /data
        read_only: true
        bind: {create_host_path: false}

networks:
  vkm_internal: {}

secrets:
  neo4j_auth:
    file: ${VKM_SECRETS_DIR}/neo4j_auth   # host-local "neo4j/<password>", mode 600, outside any repository
  # secrets of the app services: owned by VKM_DATA_UID, mode 0400 (see .env.example)
  neo4j_password:
    file: ${VKM_SECRETS_DIR}/neo4j_password     # the Neo4j password (bare, or "neo4j/<password>")
  api_read_token:
    file: ${VKM_SECRETS_DIR}/api_read_token
  api_write_token:
    file: ${VKM_SECRETS_DIR}/api_write_token
  mcp_token:
    file: ${VKM_SECRETS_DIR}/mcp_token
  mcp_admin_token:
    file: ${VKM_SECRETS_DIR}/mcp_admin_token
  rerank_token:
    file: ${VKM_SECRETS_DIR}/rerank_token
  pg_dsn:
    file: ${VKM_SECRETS_DIR}/${VKM_APP_PG_DSN_FILE:-pg_dsn}   # a copy owned by VKM_DATA_UID if pg_dsn is not
  # bearer token of the RX580 retrieval service: its own copy (owned by VKM_RX580_UID) and the api's copy (owned by
  # VKM_DATA_UID; the same file when both uids are equal)
  rx580_token:
    file: ${VKM_SECRETS_DIR}/rx580_token
  embed_token:
    file: ${VKM_SECRETS_DIR}/${VKM_APP_RX580_TOKEN_FILE:-rx580_token}
