name: PUBLIC offline CPU checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified remote tag
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, verified remote tag
        with:
          python-version: '3.13.5'
      - name: Install exact core and wheel-build pins
        run: |
          python -m pip install --no-deps -r requirements/worldspec.lock.txt
          python -m pip install --no-deps -c requirements/corpus-layout.lock.txt setuptools
      - name: World tests, public integrity, installed wheel
        run: python scripts/run_offline_checks.py world-integrity --output "$RUNNER_TEMP/world-integrity"
      - name: Preserve PASS, FAIL and NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified remote tag
        with:
          name: world-integrity
          path: ${{ runner.temp }}/world-integrity
          if-no-files-found: error

  corpus-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified remote tag
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, verified remote tag
        with:
          python-version: '3.13.5'
      - name: Install CPU host test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y djvulibre-bin tesseract-ocr rsync
      - name: Install existing exact locks and documented CPU test pins
        run: python -m pip install --no-deps -r requirements/worldspec.lock.txt -r requirements/corpus.lock.txt -r requirements/corpus-services.lock.txt -r requirements/offline-test.lock.txt
      - name: All remaining recursive offline tests
        run: python scripts/run_offline_checks.py corpus-offline --output "$RUNNER_TEMP/corpus-offline"
      - name: Preserve PASS, FAIL and NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified remote tag
        with:
          name: corpus-offline
          path: ${{ runner.temp }}/corpus-offline
          if-no-files-found: error
