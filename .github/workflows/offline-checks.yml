name: PUBLIC offline CPU checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  world-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified remote tag
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified remote tag
        with:
          python-version: '3.13.5'
      - name: Install exact core and wheel-build pins
        run: |
          python -m pip install --no-deps -r requirements/worldspec.lock.txt
          python -m pip install --no-deps -c requirements/corpus-layout.lock.txt setuptools
          python -m pip check
      - name: World tests, public integrity, installed wheel
        run: python scripts/run_offline_checks.py world-integrity --output "$RUNNER_TEMP/world-integrity"
      - name: Preserve PASS, FAIL and NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, verified remote tag
        with:
          name: world-integrity
          path: ${{ runner.temp }}/world-integrity
          if-no-files-found: error

  corpus-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified remote tag
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified remote tag
        with:
          python-version: '3.13.5'
      - name: Install CPU host test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y djvulibre-bin tesseract-ocr rsync
      - name: Install existing exact locks and documented CPU test pins
        run: |
          python -m pip install --no-deps -r requirements/worldspec.lock.txt -r requirements/corpus.lock.txt -r requirements/corpus-services.lock.txt -r requirements/offline-test.lock.txt
          python -m pip check
      - name: All remaining recursive offline tests
        run: python scripts/run_offline_checks.py corpus-offline --output "$RUNNER_TEMP/corpus-offline"
      - name: Preserve PASS, FAIL and NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, verified remote tag
        with:
          name: corpus-offline
          path: ${{ runner.temp }}/corpus-offline
          if-no-files-found: error

  windows-offline:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified remote tag
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified remote tag
        with:
          python-version: '3.13.5'
      - name: Install exact CPU locks
        run: |
          python -m pip install --no-deps -r requirements/worldspec.lock.txt -r requirements/corpus.lock.txt -r requirements/corpus-services.lock.txt -r requirements/offline-test.lock.txt
          python -m pip check
      - name: Windows filesystem, jobs, pure GIS and future-clock checks
        shell: pwsh
        run: python scripts/run_offline_checks.py windows-offline --output "$env:RUNNER_TEMP/windows-offline"
      - name: Preserve PASS, FAIL and NOT_RUN evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, verified remote tag
        with:
          name: windows-offline
          path: ${{ runner.temp }}/windows-offline
          if-no-files-found: error
