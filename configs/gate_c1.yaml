data_boundary:
  allowed_model_data: [t1_v1/train]
  prohibited_model_data: [t1_v1/validation, t1_v1/test, future_external_holdout]
  historical_validation_loaded: false
  current_test_loaded: false
  new_holdout_seen: false
  worker_outer_labels_allowed: false
  worker_manifest_arguments_allowed: false
  final_quality_claim_allowed: false

sequence:
  sequence_manifest: artifacts/splits/t1_train_gate_c_v1/sequence_manifest.csv
  sequence_rows: artifacts/splits/t1_train_gate_c_v1/sequence_rows.csv
  sequence_contract: artifacts/splits/t1_train_gate_c_v1/sequence_contract.json
  fold_contracts: artifacts/splits/t1_train_gate_c_v1/fold_sequence_contracts.csv
  max_length: 16
  padding_side: left
  numeric_channels:
    - last_settlement_mm
    - last_rate_mm_y
    - current_standard_uncertainty_mm
    - days_since_previous_observation
    - missing_campaigns_since_previous
  categorical_channels: [current_campaign_type]
  masks: [padding_mask, observation_mask, missing_campaign_mask]
  metadata_only:
    - sample_id
    - point_id
    - profile_id
    - zone_id
    - campaign_id
    - current_campaign_id
    - target_campaign_id
    - observation_id

resampling:
  benchmark_plan: artifacts/splits/t1_train_benchmark_v1/benchmark_plan.json
  outer_assignments: artifacts/splits/t1_train_benchmark_v1/outer_assignments.csv
  inner_assignments: artifacts/splits/t1_train_benchmark_v1/inner_assignments.csv
  fold_contracts: artifacts/splits/t1_train_benchmark_v1/fold_contracts.csv
  design: rolling_origin
  outer_folds: 11
  inner_folds_per_outer: 3
  unique_inner_manifest_pairs: 13
  random_kfold_allowed: false
  random_split_allowed: false

architecture_source:
  config: configs/gate_c.yaml
  config_sha256: b5a659c5fd427d2877485beeee8b1f8c6b5358b3929095c5be0c13135f2c4e6e
  include_status: REQUIRED_COMPACT_SCREEN
  required_model_ids:
    - C01_compact_gru
    - C02_compact_lstm
    - C03_causal_tcn
    - C04_probabilistic_gru_student_t
  expected_configuration_counts:
    C01_compact_gru: 16
    C02_compact_lstm: 16
    C03_causal_tcn: 16
    C04_probabilistic_gru_student_t: 8
  total_configurations: 56

training:
  seeds: [42117, 42118, 42119, 42120, 42121]
  point_loss: huber
  huber_delta_standardized: 1.0
  probabilistic_loss: student_t_nll
  optimizer: AdamW
  learning_rate: 0.001
  batch_size: 32
  max_epochs: 2000
  patience: 100
  min_delta: 0.0
  gradient_clip_norm: 1.0
  device: cuda
  dataloader_workers: 0
  deterministic_algorithms: true
  cublas_workspace_config: ':4096:8'
  cudnn_benchmark: false
  tf32: false
  mixed_precision: false
  max_parameter_count: 100000
  outer_epoch_rule: median_of_15_selected_inner_best_epochs
  optimizer_backend: fused_adamw_cuda
  validation_metric_device: cuda
  recurrent_execution: vectorized_right_padding_dense_cuda
  inference_mode: true
  torch_compile: false

checkpointing:
  root: work/gate_c1/checkpoints
  keep_top_k: 5
  stage_interval_epochs: 50
  inner_ranking: metric_ascending_then_epoch
  inner_selection: rank_1_inner_objective
  outer_ranking: latest_epoch_fixed_final
  outer_selection: fixed_final_epoch
  ranked_checkpoint_payload: full_training_state
  recovery_checkpoint: latest_completed_50_epoch_stage_and_terminal
  persistence_scope: work_only
  atomic_writes: true
  outer_labels_allowed: false

selection:
  point_models_objective: pooled_row_level_inner_mae
  probabilistic_model_objective: pooled_row_level_inner_crps
  probabilistic_tie_breaker: pooled_row_level_inner_mae
  common_tie_breakers: [primary_objective, parameter_count, canonical_parameter_json]
  seed_selection_allowed: false
  transition_metrics_allowed: false
  profile_metrics_allowed: false
  zone_metrics_allowed: false
  crps_quantile_grid:
    start: 0.01
    stop: 0.99
    step: 0.01

cache:
  enabled: true
  root: work/gate_c1/inner_cache
  logical_inner_fits: 9240
  expected_physical_inner_fits: 3640
  exact_hash_match_required: true
  cache_key_fields:
    - model_spec_sha256
    - parameter_sha256
    - seed
    - train_sample_ids_sha256
    - validation_sample_ids_sha256
    - train_sequence_pairs_sha256
    - validation_sequence_pairs_sha256
    - train_target_sha256
    - validation_target_sha256
    - preprocessing_contract_sha256
    - code_sha256
    - environment_sha256

environment:
  environment_id: gate_c_torch
  path: work/environments/gate_c_torch
  lock: requirements/gate_c_torch.lock.txt
  python_version: '3.13'
  torch_version: 2.13.0+cu130
  cuda_runtime: '13.0'
  required_gpu_name: NVIDIA GeForce RTX 5070 Ti
  torch_wheel_index: https://download.pytorch.org/whl/cu130
  runtime_network_allowed: false
  deterministic_tolerance: 1.0e-6
  external_pretrained_models_allowed: false

prediction_schema:
  worker_forbidden_columns: [y_true, observed_rate_mm_y, target_value]
  required_columns:
    - model_id
    - family
    - fold_id
    - seed
    - sample_id
    - y_pred
    - environment_id
    - model_spec_sha256
    - config_sha256
    - code_sha256
    - environment_sha256
    - expected_sample_ids_sha256
    - selected_parameter_sha256
    - selected_parameter_json
    - epoch_count
    - parameter_count
    - fit_seconds
    - inference_seconds
    - peak_ram_mb
    - peak_vram_mb
    - aggregation
  probabilistic_optional_columns:
    - distribution_family
    - distribution_loc
    - distribution_scale
    - distribution_df
    - q025
    - q10
    - q25
    - q50
    - q75
    - q90
    - q975

metrics:
  point:
    - mae
    - median_absolute_error
    - rmse
    - bias
    - absolute_bias
    - p90_absolute_error
    - p95_absolute_error
    - max_absolute_error
    - r2_descriptive
    - precision_weighted_mae
    - precision_weighted_rmse
    - b1_skill
    - mase
    - direction_accuracy
  native_student_t:
    - crps
    - nll
    - coverage_50
    - coverage_80
    - coverage_95
    - mean_interval_width
    - median_interval_width
    - interval_score

temporal_admission:
  required_outer_folds: 11
  required_seeds: 5
  pooled_mae_ratio_vs_b1_max: 1.10
  median_fold_mae_ratio_vs_b1_max: 1.10
