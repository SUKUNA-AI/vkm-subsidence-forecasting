[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vkm-world"
version = "0.1.0"
description = "Typed, evidence-backed world specification (WorldSpec) for surface subsidence research at the Verkhnekamskoye potash deposit (VKM, SKRU-1)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.3,<3",
    "pydantic>=2.13.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vkm_world*"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
