[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skru1-research"
version = "0.1.0"
description = "Reproducible data and modelling workflow for the SKRU-1 diploma project"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
